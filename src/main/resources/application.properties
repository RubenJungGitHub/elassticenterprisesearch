spring.application.name=uuidutil
server.port=5004
# bind to all interfaces
server.address=0.0.0.0
alfresco.api.url=https://alfresco-proxy-route-contain-dvl.apps.ocp0.anders-nogic.atos.net/
alfresco.api.username=admin
alfresco.api.password=admin
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.username=elastic
