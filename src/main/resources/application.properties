spring.application.name=enterprisesearch
server.port=5004
# bind to all interfaces
server.address=0.0.0.0

# Alfresco instellingen (met fallback voor lokaal)
alfresco.api.url=${ALFRESCO_API_URL:https://alfresco-proxy-route-contain-dvl.apps.ocp0.anders-nogic.atos.net/}
alfresco.api.username=${ALFRESCO_API_USERNAME:admin}
alfresco.api.password=${ALFRESCO_API_PASSWORD:admin}

# Elasticsearch instellingen (in OpenShift wijst dit naar de service i.p.v. localhost)
spring.elasticsearch.uris=${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
spring.elasticsearch.username=${SPRING_ELASTICSEARCH_USERNAME:elastic}
spring.elasticsearch.password=${SPRING_ELASTICSEARCH_PASSWORD:admin}

# SharePoint / Microsoft Graph instellingen
sharepoint.graph.base-url=${SHAREPOINT_GRAPH_BASE_URL:https://graph.microsoft.com/}
sharepoint.client.id=${SHAREPOINT_CLIENT_ID}
sharepoint.client.secret=${SHAREPOINT_CLIENT_SECRET}
sharepoint.tenant.id=${SHAREPOINT_TENANT_ID}

# Optionele vertragingen tussen cycli (in milliseconden)
sync.alfresco.delay=60000
sync.sharepoint.delay=60000
spring.jackson.property-naming-strategy=SNAKE_CASE